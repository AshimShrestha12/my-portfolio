<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stylish Digital Clock</title>
  <style>
    :root {
      --bg-color: #121212;
      --primary: #1DB954;
      --secondary: #191414;
      --accent: #FFFFFF;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, var(--bg-color), var(--secondary));
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: var(--accent);
    }

    .clock-wrapper {
      background-color: rgba(25, 20, 20, 0.7);
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      text-align: center;
      min-width: 200px;
    }

    .digital-clock {
      font-size: 2em;
      font-weight: bold;
      color: var(--accent);
      text-align: center;
      margin-bottom: 5px;
    }

    .date {
      font-size: 0.9em;
      color: #ccc;
      margin-top: 10px;
    }

    @media (max-width: 600px) {
      .digital-clock {
        font-size: 1.5em;
      }
      .date {
        font-size: 0.75em;
      }
    }
  </style>
</head>

<body>
  <div class="clock-wrapper">
    <div class="digital-clock" id="digitalClock">00:00:00</div>
    <div class="date" id="date"></div>
  </div>

  <script>
    function isMobile() {
      return window.innerWidth <= 600;
    }

    function updateClock() {
      const now = new Date();
      const hour = now.getHours().toString().padStart(2, '0');
      const minute = now.getMinutes().toString().padStart(2, '0');
      const second = now.getSeconds().toString().padStart(2, '0');

      document.getElementById('digitalClock').textContent = `${hour}:${minute}:${second}`;

      let dateOptions = isMobile()
        ? { month: 'short', day: 'numeric' }
        : { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' };

      document.getElementById('date').textContent = now.toLocaleString(undefined, dateOptions);
    }

    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>

</html>
