<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Ashim Shrestha | Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* ... (previous CSS remains the same until button styles) ... */

    /* Updated Button Styles */
    .nav-button, .more-button {
      padding: 10px 20px;
      background-color: var(--accent);
      color: #000;
      border: none;
      border-radius: 8px;
      font-size: 0.95em;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
      border: 1px solid rgba(0, 255, 204, 0.8);
    }

    .nav-button {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 100;
    }

    .more-button {
      margin: 20px auto 0;
      display: block;
      width: fit-content;
    }

    .nav-button:hover, .more-button:hover {
      background-color: #000;
      color: var(--accent);
      box-shadow: 0 0 15px var(--accent);
      transform: translateY(-2px);
    }

    .nav-button:active, .more-button:active {
      transform: translateY(1px);
    }

    /* Button animation effects */
    .nav-button::before, .more-button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(0, 255, 204, 0.4),
        transparent
      );
      transition: 0.5s;
    }

    .nav-button:hover::before, .more-button:hover::before {
      left: 100%;
    }

    /* ... (rest of the existing CSS remains the same) ... */

    /* Desktop Styles */
    @media (min-width: 768px) {
      /* ... (previous desktop styles remain) ... */

      .nav-button, .more-button {
        padding: 12px 25px;
        font-size: 1em;
      }

      .nav-button {
        top: 20px;
        right: 20px;
      }
    }

    /* Large Desktop */
    @media (min-width: 1024px) {
      /* ... (previous large desktop styles remain) ... */

      .nav-button, .more-button {
        padding: 14px 30px;
      }
    }
  </style>
</head>
