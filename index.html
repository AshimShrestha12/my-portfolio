<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Realistic Mountain Background</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .animated-mountain {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: -3;
    }

    #bg-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.6);
    }

    .cloud-layer {
      position: absolute;
      top: 0;
      left: -50%;
      width: 200%;
      height: 100%;
      background: url('https://www.transparenttextures.com/patterns/clouds.png') repeat-x;
      animation: moveClouds 60s linear infinite;
      opacity: 0.12;
      z-index: -2;
    }

    @keyframes moveClouds {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    .fog-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to top, rgba(10, 25, 47, 0.7), rgba(10, 25, 47, 0));
      z-index: -1;
    }

    .content {
      position: relative;
      z-index: 1;
      color: white;
      text-align: center;
      top: 40%;
      transform: translateY(-50%);
    }

    .content h1 {
      font-size: 3rem;
      margin-bottom: 0.5rem;
    }

    .content p {
      font-size: 1.2rem;
      opacity: 0.8;
    }

    @media (max-width: 768px) {
      .content h1 {
        font-size: 2rem;
      }

      .content p {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>

  <!-- Animated Background Layers -->
  <div class="animated-mountain">
    <video autoplay muted loop playsinline id="bg-video">
      <source src="https://cdn.coverr.co/videos/coverr-misty-mountains-7347/1080p.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
    <div class="cloud-layer"></div>
    <div class="fog-overlay"></div>
  </div>

  <!-- Main Content -->
  <div class="content">
    <h1>Welcome to My Portfolio</h1>
    <p>Experience the calm of the mountains with every scroll</p>
  </div>

</body>
</html>
