<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ashim Shrestha</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    /* Reset and basics */
    * {
      margin: 0; padding: 0; box-sizing: border-box;
    }
    body, html {
      height: 100%;
      overflow-x: hidden;
      font-family: 'Montserrat', sans-serif;
      background: linear-gradient(to top, #2b3a67 0%, #87ceeb 100%);
      color: white;
      position: relative;
    }

    /* Container for portfolio content */
    .content {
      position: relative;
      z-index: 10;
      padding: 2rem;
      max-width: 900px;
      margin: 0 auto;
      text-align: center;
      user-select: none;
    }
    h1 {
      font-weight: 700;
      font-size: 3rem;
      margin-bottom: 1rem;
      text-shadow: 0 2px 10px rgba(0,0,0,0.7);
    }
    p {
      font-weight: 400;
      font-size: 1.2rem;
      line-height: 1.6;
      max-width: 600px;
      margin: 0 auto 2rem;
      text-shadow: 0 1px 8px rgba(0,0,0,0.6);
    }

    /* SVG full screen for mountain and sky */
    svg#mountains {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100vw;
      height: 60vh;
      z-index: 1;
      user-select: none;
      pointer-events: none;
    }

    /* Mountain shapes */
    .mountain {
      fill: url(#mountainGradient);
      filter: drop-shadow(0 5px 4px rgba(0,0,0,0.4));
      transition: fill 1s ease;
    }

    /* Snowcaps - white polygon overlays */
    .snowcap {
      fill: white;
      opacity: 0.85;
      filter: drop-shadow(0 0 5px rgba(255 255 255 / 0.7));
    }

    /* Clouds container */
    .clouds {
      position: fixed;
      top: 5vh;
      left: 0;
      width: 100vw;
      height: 25vh;
      pointer-events: none;
      z-index: 2;
      overflow: visible;
    }

    /* Cloud shape */
    .cloud {
      position: absolute;
      background: white;
      background: radial-gradient(circle at 40% 50%, #fff, #ddd);
      border-radius: 40% / 50%;
      filter: drop-shadow(0 0 8px rgba(255 255 255 / 0.8));
      opacity: 0.8;
      animation-timing-function: linear;
      will-change: transform;
    }
    /* Different sizes */
    .cloud1 {
      width: 180px;
      height: 90px;
      top: 15%;
      left: -20%;
      animation-name: cloudMove1;
      animation-duration: 130s;
      animation-iteration-count: infinite;
    }
    .cloud2 {
      width: 120px;
      height: 60px;
      top: 40%;
      left: -25%;
      animation-name: cloudMove2;
      animation-duration: 95s;
      animation-iteration-count: infinite;
    }
    .cloud3 {
      width: 150px;
      height: 75px;
      top: 5%;
      left: -30%;
      animation-name: cloudMove3;
      animation-duration: 150s;
      animation-iteration-count: infinite;
    }

    /* Cloud animations - move horizontally */
    @keyframes cloudMove1 {
      0% { transform: translateX(0); }
      100% { transform: translateX(130vw); }
    }
    @keyframes cloudMove2 {
      0% { transform: translateX(0); }
      100% { transform: translateX(120vw); }
    }
    @keyframes cloudMove3 {
      0% { transform: translateX(0); }
      100% { transform: translateX(140vw); }
    }

    /* Snowflakes container */
    .snowflakes {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 3;
      overflow: visible;
    }

    /* Snowflake style */
    .snowflake {
      position: absolute;
      top: -10px;
      background: white;
      border-radius: 50%;
      opacity: 0.9;
      filter: drop-shadow(0 0 2px rgba(255 255 255 / 0.8));
      animation-name: fall;
      animation-timing-function: linear;
      will-change: transform;
    }

    @keyframes fall {
      to {
        transform: translateY(110vh);
      }
    }

  </style>
</head>
<body>

  <div class="content">
    <h1>Ashim Shrestha</h1>
    <p>Welcome to my portfolio. Explore mountains of creativity and snowy peaks of ideas.</p>
  </div>

  <!-- Mountains SVG -->
  <svg id="mountains" viewBox="0 0 1440 400" preserveAspectRatio="none" aria-hidden="true" >
    <defs>
      <linearGradient id="mountainGradient" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#4a678f" />
        <stop offset="70%" stop-color="#1b2b46" />
      </linearGradient>
    </defs>

    <!-- Large mountain -->
    <path class="mountain" d="M150 400 L350 150 L500 400 Z" />
    <path class="snowcap" d="M350 150 L400 230 L300 230 Z" />

    <!-- Medium mountain -->
    <path class="mountain" d="M480 400 L630 200 L770 400 Z" />
    <path class="snowcap" d="M630 200 L670 260 L580 260 Z" />

    <!-- Small mountain -->
    <path class="mountain" d="M800 400 L900 250 L1000 400 Z" />
    <path class="snowcap" d="M900 250 L940 300 L860 300 Z" />

    <!-- Far mountain -->
    <path class="mountain" d="M1050 400 L1150 300 L1300 400 Z" />
    <path class="snowcap" d="M1150 300 L1200 350 L1100 350 Z" />
  </svg>

  <!-- Clouds -->
  <div class="clouds" aria-hidden="true">
    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>
    <div class="cloud cloud3"></div>
  </div>

  <!-- Snowflakes container -->
  <div class="snowflakes" aria-hidden="true"></div>

  <script>
    // Create snowflakes dynamically
    const snowflakesContainer = document.querySelector('.snowflakes');
    const snowflakeCount = 80;

    for(let i = 0; i < snowflakeCount; i++) {
      const snowflake = document.createElement('div');
      snowflake.classList.add('snowflake');

      // Random size from 2 to 6 px
      const size = (Math.random() * 4) + 2;
      snowflake.style.width = `${size}px`;
      snowflake.style.height = `${size}px`;

      // Random horizontal start position
      snowflake.style.left = `${Math.random() * 100}vw`;

      // Random animation duration 10s to 30s
      const duration = (Math.random() * 20) + 10;
      snowflake.style.animationDuration = `${duration}s`;

      // Random animation delay so they don’t fall together
      snowflake.style.animationDelay = `${Math.random() * duration}s`;

      snowflakesContainer.appendChild(snowflake);
    }
  </script>

</body>
</html>
